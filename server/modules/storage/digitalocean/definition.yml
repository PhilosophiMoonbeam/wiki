key: digitalocean
title: DigitalOcean Spaces
description: DigitalOcean provides developers and businesses a reliable, easy-to-use cloud computing platform of virtual servers (Droplets), object storage (Spaces) and more.
author: andrewsim
logo: https://static.requarks.io/logo/digitalocean.svg
website: https://www.digitalocean.com/products/spaces/
isAvailable: true
supportedModes:
  - push
defaultMode: push
schedule: false
props:
  region:
    type: String
    title: Signing region
    hint: DigitalOcean recommends us-east-1 for AWS SDK clients; the endpoint determines the datacenter. Leave empty to retain the application's AWS region provider.
    default: ''
    order: 1.5
  endpoint:
    type: String
    title: Endpoint
    hint: The datacenter endpoint for your existing Space, such as nyc3.digitaloceanspaces.com. Use the origin endpoint, not its CDN address.
    default: nyc3.digitaloceanspaces.com
    order: 1
  bucket:
    type: String
    title: Space name
    hint: The name of an existing Space. Applying settings checks access; it does not create a Space.
    order: 2
  accessKeyId:
    type: String
    title: Access Key ID
    hint: The Access Key (Generated in API > Tokens/Keys > Spaces access keys).
    order: 3
  secretAccessKey :
    type: String
    title: Access Key Secret
    hint: The Access Key Secret for the Access Key ID you created above.
    sensitive: true
    order: 4
  pathPrefix:
    type: String
    title: Path Prefix
    hint: Optional folder path prepended to every stored page and asset.
    default: ''
    order: 5
actions:
  - handler: exportAll
    label: Export All
    hint: Output all content from the DB to DigitalOcean Spaces, overwriting any existing data. If you enabled DigitalOcean Spaces after content was created or you temporarily disabled it, you'll want to execute this action to add the missing content.
