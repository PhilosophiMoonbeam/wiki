key: s3generic
title: S3-compatible storage
description: Store shared content in a bucket on a service that implements the S3 API.
author: requarks.io
logo: https://static.requarks.io/logo/aws-s3-alt.svg
website: https://wiki.js.org
isAvailable: true
supportedModes:
  - push
defaultMode: push
schedule: false
props:
  region:
    type: String
    title: Signing region
    hint: Use the region required by your service (for example us-east-1 or auto). Leave empty to use the application's AWS region provider.
    default: ''
    order: 1.5
  endpoint:
    type: String
    title: Endpoint URI
    hint: The full S3-compliant endpoint URI.
    default: ''
    order: 1
  bucket:
    type: String
    title: Bucket name
    hint: The name of an existing bucket. Applying settings checks access; it does not create a bucket.
    order: 2
  accessKeyId:
    type: String
    title: Access Key ID
    hint: The Access Key ID.
    order: 3
  secretAccessKey:
    type: String
    title: Access Key Secret
    hint: The Access Key Secret for the Access Key ID above.
    sensitive: true
    order: 4
  sslEnabled:
    type: Boolean
    title: Use HTTPS for bare hostnames
    hint: Applies only when the endpoint omits its scheme. A full endpoint URL determines its own HTTP or HTTPS transport.
    default: true
    order: 5
  s3ForcePathStyle:
    type: Boolean
    title: Force Path Style for S3 objects
    hint: Whether to force path style URLs for S3 objects.
    default: false
    order: 6
  s3BucketEndpoint:
    type: Boolean
    title: Single Bucket Endpoint
    hint: Whether the provided endpoint addresses an individual bucket.
    default: false
    order: 7
  pathPrefix:
    type: String
    title: Path Prefix
    hint: Optional folder path prepended to every stored page and asset.
    default: ''
    order: 8
actions:
  - handler: exportAll
    label: Export All
    hint: Output all content from the DB to the external service, overwriting any existing data. If you enabled this module after content was created or you temporarily disabled it, you'll want to execute this action to add the missing content.
